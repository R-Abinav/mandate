name: CI

# NOTE (2026-09-04): the test-integration job below is EXPECTED to be red
# right now, for two known, documented reasons — not a silent regression:
#   1. TestMandateLifecycle/7_ExecuteDebit_InCap: cassette predates the
#      compact-envelope capture-verification fix, so replay fails with
#      "requested interaction not found." See the comment directly above
#      that subtest in test/integration/mandate_lifecycle_test.go.
#   2. TestMandateLifecycle/8_ExecuteDebit_MaxAmountExceeded: intentionally
#      skipped. Both (1) and (2) need a live re-record against Razorpay's
#      test-mode API, which is currently blocked by an exhausted daily
#      pre-debit-notification quota on the only available token (confirmed
#      by direct live attempt, not assumed). See the comment above that
#      subtest for the full record.
# Do not "fix" this job by loosening assertions or scoping tests out; (1)
# and (2) need a real fix — a live re-record once quota resets — not a
# workaround here. The previous third reason (no Postgres provisioned in
# this job, so DATABASE_URL_TEST-dependent tests like
# TestPolicyStore_Concurrency had nothing to run against) is fixed below:
# a postgres service container plus a migration step now provision it.
on:
  push:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test-integration:
    runs-on: ubuntu-latest
    # Known red today — see the dated note at the top of this file. Left
    # blocking (no continue-on-error) so the state stays visible in CI
    # rather than silently muted.
    services:
      # Same image, credentials, and healthcheck as docker-compose.yml's
      # own Postgres service — not a separate, drifting definition.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mandate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mandate_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      # Steps in this job run directly on the runner, not inside a
      # container, so the postgres service (published via ports: above) is
      # reachable at localhost. Both vars point at it: DATABASE_URL_TEST is
      # what every current integration test actually reads; DATABASE_URL
      # is set too in case anything ever reads that instead.
      DATABASE_URL_TEST: postgres://postgres:password@localhost:5432/mandate_test?sslmode=disable
      DATABASE_URL: postgres://postgres:password@localhost:5432/mandate_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run database migrations
        # Same migrate/migrate image and version already proven against
        # this exact migrations/ directory in the Docker work
        # (docker-compose.yml's migrate service) — not a different
        # mechanism. --network host so this one-off container reaches the
        # postgres service via the runner's localhost, the same way the
        # steps above do.
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/migrations:/migrations \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database "postgres://postgres:password@localhost:5432/mandate_test?sslmode=disable" \
            up

      - name: Integration tests (tagged)
        run: go test -v -race -tags=integration ./...