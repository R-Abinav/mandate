version: '3.8'

services:
  gateway:
    image: alpine:latest
    container_name: gateway
    env_file:
      - .env
    command: ["sh", "-c", "echo 'Gateway service placeholder running...'; sleep infinity"]
    ports:
      - "8080:8080"
      
  test-db:
    image: postgres:16-alpine
    container_name: mandate_test_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mandate_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mandate_test"]
      interval: 2s
      timeout: 5s
      retries: 10
